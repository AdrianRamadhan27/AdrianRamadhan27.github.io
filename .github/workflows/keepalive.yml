name: Supabase keepalive

# Free-tier Supabase projects pause after ~7 days with no API activity. This
# pings a real table daily so the project (and this scheduled workflow
# itself — GitHub disables cron workflows after 60 days of repo inactivity)
# never goes quiet for that long.
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          # NOT the bare /rest/v1/ root -- verified directly against the
          # live API that it 401s no matter what headers accompany the
          # anon key ({"message":"Invalid API key","hint":"Only the
          # service_role API key can be used for this endpoint."}).
          # Supabase deliberately locks that one path to service_role
          # because it serves the full OpenAPI schema for every table,
          # anon-readable or not. A real anon-readable table (any row,
          # any column) is what actually counts as "activity" and is what
          # the anon key can legitimately reach -- both headers are still
          # required on this one, same as any edge function call.
          curl -sf -o /dev/null -w "%{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profile?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
