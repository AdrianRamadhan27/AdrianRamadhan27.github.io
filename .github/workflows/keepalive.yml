name: Supabase keepalive

# Free-tier Supabase projects pause after ~7 days with no API activity. This
# pings the REST root daily so the project (and this scheduled workflow
# itself — GitHub disables cron workflows after 60 days of repo inactivity)
# never goes quiet for that long.
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          # Supabase's gateway (Kong) requires BOTH headers on /rest/v1/* --
          # apikey alone 401s. Same requirement documented in
          # src/lib/chatClient.ts for the edge functions; missed here
          # originally because a REST root ping looked simpler than it is.
          curl -sf -o /dev/null -w "%{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
